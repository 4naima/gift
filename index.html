<!DOCTYPE html>
<html>
<head>
  <title>Birthday Gift</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background: linear-gradient(to bottom, #ffd6e7, #fff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    #countdown {
      font-size: 40px;
      font-weight: bold;
    }

    #hiddenContent {
      display: none;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      background: #ff8fab;
      color: white;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="countdown"></div>

<div id="hiddenContent">
  <h1>💌 Happy Birthday 💌</h1>
  <p>The real surprise starts here...</p>
  <button onclick="alert('Next we add the envelope animation 💖')">
    Open Envelope
  </button>
</div>

<script>
  const birthday = new Date("February 20, 2026 00:00:00").getTime();

  const timer = setInterval(function() {
    const now = new Date().getTime();
    const distance = birthday - now;

    if (distance < 0) {
      clearInterval(timer);
      document.getElementById("countdown").style.display = "none";
      document.getElementById("hiddenContent").style.display = "block";
    } else {
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      document.getElementById("countdown").innerHTML =
        "⏳ " + days + " days left...";
    }
  }, 1000);
</script>

</body>
</html>
