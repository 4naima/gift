<!DOCTYPE html>
<html>
<head>
  <title>Birthday Gift</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background: linear-gradient(to bottom, #ffd6e7, #fff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    #countdown {
      font-size: 40px;
      font-weight: bold;
    }

    #hiddenContent {
      display: none;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      background: #ff8fab;
      color: white;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="countdown"></div>

<div id="hiddenContent" style="display:none; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:20px;">
  
  <h1>💌 Happy Birthday 💌</h1>

  <!-- Envelope -->
  <img id="envelope" src="envelope.png" style="width:200px; cursor:pointer;" onclick="openLetter()" />

  <!-- Letter (hidden initially) -->
  <div id="letter" style="display:none; max-width:400px;">
    <p style="font-family: 'Cursive', serif; font-size:18px; background:#fff2e6; padding:20px; border-radius:10px;">
      Dear [Her Name],<br><br>
      Happy Birthday! 🎉💖<br>
      [Your letter content goes here...]
    </p>
  </div>

</div>

<script>
  const birthday = new Date("February 20, 2026 00:00:00").getTime();

  const timer = setInterval(function() {
    const now = new Date().getTime();
    const distance = birthday - now;

    if (distance < 0) {
      clearInterval(timer);
      document.getElementById("countdown").style.display = "none";
      document.getElementById("hiddenContent").style.display = "block";
    } else {
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      document.getElementById("countdown").innerHTML =
        "⏳ " + days + " days left...";
    }
  }, 1000);
  function openLetter() {
    document.getElementById("envelope").style.display = "none";
    document.getElementById("letter").style.display = "block";
  }
</script>
}
</body>
</html>
